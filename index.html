<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpportunityBridge | Scheme & Internship Finder</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">🎓 OpportunityBridge</a>
        </div>
    </nav>

    <!-- Hero Section -->
    <div class="container mt-5 text-center">
        <h1 class="fw-bold">Find Your Next Big Opportunity</h1>
        <p class="text-muted lead">Discover government schemes, internships, and hackathons tailored for you.</p>
    </div>

    <!-- Search and Filter Section -->
    <div class="container mt-4">
        <div class="row justify-content-center g-2">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control form-control-lg shadow-sm border-0" placeholder="Search keywords, schemes, or titles...">
            </div>
            <div class="col-md-3">
                <select id="categoryFilter" class="form-select form-select-lg shadow-sm border-0">
                    <option value="All">All Categories</option>
                    <option value="Internship">Internships</option>
                    <option value="Hackathon">Hackathons</option>
                    <option value="Government Scheme">Government Schemes</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Main Content Area where cards will appear -->
    <div class="container mt-5 mb-5">
        <div class="row g-4" id="opportunities-container">
            <!-- JavaScript will inject the cards right here -->
        </div>
    </div>

    <!-- Link to our JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
